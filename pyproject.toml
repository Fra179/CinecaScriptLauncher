[project]
name = "cineca-grader-launcher"
version = "0.1.0"
description = "Run scripts on CINECA Leonardo over SSH and wait for completion"
readme = "README.md"
authors = [
    { name = "Francesco De Benedittis", email = "contact@francescodb.it" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
cineca-grader-launcher = "cineca_grader_launcher:main"
cineca-login = "cineca_grader_launcher.login_cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
